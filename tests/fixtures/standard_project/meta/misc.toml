[[tables]]
name = "game_rules"
kind = "object"
source = "game_rules.csv"

[[tables.fields]]
name = "max_player_level"
type = "int"
required = true

[[tables.fields]]
name = "starter_gold"
type = "int"
required = true

[[tables.fields]]
name = "default_class_id"
type = "int"
required = true
foreign_key = { name = "default_class", target_table = "classes", target_index = "by_id", linked_field = "default_class" }

[[tables.fields]]
name = "starter_item_ids"
type = "int[]"
required = true
foreign_key = { name = "starter_item", target_table = "items", target_index = "by_id", linked_field = "starter_items" }

[[tables.fields]]
name = "starter_reward"
type = "FixedReward"
required = true
desc = "新玩家默认初始固定奖励，用一个字段同时表达金币、经验和内嵌道具列表。"

[[tables.fields]]
name = "stamina_cap"
type = "int"
required = true

[[tables.fields]]
name = "daily_reset_hour"
type = "int"
required = true

[[tables.fields]]
name = "pvp_enabled"
type = "bool"
required = true
