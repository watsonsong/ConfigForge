[[tables]]
name = "items"
kind = "collection"
primary_index = "by_id"
sources = [{ provider = "csv", path = "items.csv" }]

[[tables.fields]]
name = "id"
type = "int"
required = true

[[tables.fields]]
name = "name"
type = "string"
required = true

[[tables.fields]]
name = "price"
type = "int"
required = true

[[tables.fields]]
name = "enabled"
type = "bool"
required = true

[[tables.indexes]]
name = "by_id"
fields = ["id"]
unique = true
primary = true

[[tables]]
name = "game_rules"
kind = "object"
source = "game_rules.csv"

[[tables.fields]]
name = "max_player_level"
type = "int"
required = true

[[tables.fields]]
name = "starter_gold"
type = "int"
required = true

[[tables.fields]]
name = "stamina_cap"
type = "int"
required = true

[[tables.fields]]
name = "daily_reset_hour"
type = "int"
required = true

[[tables.fields]]
name = "pvp_enabled"
type = "bool"
required = true
