imports = [
    "meta/items.toml",
    "meta/characters.toml",
    "meta/misc.toml",
]

[project]
name = "standard_reference_game"
desc = "Standard reference game fixture used by integration tests."
input = "data"

[[targets]]
name = "client"
tags = ["client"]

[[targets.exports]]
type = "json"
output = "out/client_data/json"

[[targets.exports]]
type = "bin"
output = "out/client_data/binary"

[[targets.exports]]
type = "messagepack"
output = "out/client_data/msgpack"

[[targets.exports]]
type = "gettext_pot"
output = "out/client_i18n"
domain = "reference_game_config"
file_name = "reference_game_config.pot"
context = "table_field"
source_reference = "both"

[[targets.exports]]
type = "lua_table"
output = "out/client_lua"
module_name = "reference_game_config"
root_file = "init.lua"
row_layout = "array_with_metatable"
lazy_require = true

[targets.exports.i18n]
mode = "global_function"
function = "globalTranslate"
returns = "optional"

[[targets.exports]]
type = "rust"
output = "out/client_code/rust"
file_name = "reference_game_config"
module_name = "reference_game_config"

[targets.exports.i18n]
mode = "global_function"
function = "crate::global_translate"
returns = "optional"

[[targets.exports]]
name = "rust_external"
type = "rust"
output = "out/client_code/rust_external"
file_name = "reference_game_config"
module_name = "reference_game_config"

[targets.exports.rust]
runtime_interface = "external"

[[targets.exports]]
type = "typescript"
output = "out/client_code/typescript"
file_name = "reference_game_config"
module_name = "referenceGameConfig"

[targets.exports.i18n]
mode = "global_function"
function = "globalTranslate"
returns = "optional"
typescript_import = "import { globalTranslate } from './i18n'"

[[targets.exports]]
type = "cpp"
output = "out/client_code/cpp"
file_name = "reference_game_config"
module_name = "ReferenceGameConfig"
namespace = "reference::game::config"

[targets.exports.i18n]
mode = "global_function"
function = "GlobalTranslate"
returns = "optional"
cpp_include = "\"reference_game_i18n.hpp\""

[[targets.exports]]
name = "cpp_external"
type = "cpp"
output = "out/client_code/cpp_external"
file_name = "reference_game_config"
module_name = "ReferenceGameConfig"
namespace = "reference::game::config"

[targets.exports.cpp]
runtime_interface = "external"

[targets.exports.i18n]
mode = "global_function"
function = "GlobalTranslate"
returns = "optional"
cpp_include = "\"reference_game_i18n.hpp\""

[[targets.exports]]
type = "cpp_unreal"
output = "out/client_code/cpp_unreal"
file_name = "reference_game_config"
namespace = "ReferenceGameConfig"

[targets.exports.cpp_unreal]
support = "containers"
api_macro = "REFERENCE_GAME_CONFIG_API"

[[targets.exports]]
type = "csharp"
output = "out/client_code/csharp"
file_name = "reference_game_config"
namespace = "ReferenceGame.Config"

[targets.exports.csharp]
nullable = true
access_modifier = "public"

[[targets.exports]]
type = "java"
output = "out/client_code/java"
file_name = "ReferenceGameConfig"
namespace = "referencegame.config"

[targets.exports.java]
package = "referencegame.config"
root_class_name = "ReferenceGameConfig"
access_modifier = "public"

[[targets]]
name = "server"
tags = ["server"]

[[targets.exports]]
type = "messagepack"
output = "out/server_data/msgpack"

[[targets.exports]]
type = "bin"
output = "out/server_data/binary"

[[targets.exports]]
type = "rust"
output = "out/server_code/rust"
file_name = "reference_game_config"
module_name = "reference_game_config"

[targets.exports.i18n]
mode = "global_function"
function = "crate::global_translate"
returns = "optional"
