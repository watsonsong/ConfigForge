imports = [
    "meta/common.toml",
    "meta/items.toml",
    "meta/characters.toml",
    "meta/gameplay.toml",
    "meta/misc.toml",
]

[project]
name = "standard_reference_game"
desc = "Standard reference game fixture used by integration tests."
input = "data"

[[targets]]
name = "schema_docs"
tags = ["client", "server"]

[[targets.exports]]
name = "meta_schema_doc"
type = "schema_doc"
output = "out/schema_docs"
format = "markdown"
title = "Reference Game Meta Schema Documentation"

[[targets.exports]]
name = "meta_schema_doc_html"
type = "schema_doc"
output = "out/schema_docs_html"
format = "html"
title = "Reference Game Meta Schema Documentation"

[[targets]]
name = "client"
tags = ["client"]

[[targets.exports]]
type = "json"
output = "out/client_data/json"

[[targets.exports]]
type = "bin"
output = "out/client_data/binary"

[[targets.exports]]
type = "messagepack"
output = "out/client_data/msgpack"

[[targets.exports]]
type = "gettext_pot"
output = "out/client_i18n"
domain = "reference_game_config"
file_name = "reference_game_config.pot"
context = "table_field"
source_reference = "both"

[[targets.exports]]
name = "client_validation_report"
type = "validation_report"
output = "out/client_reports"
format = "html"
file_name = "validation.html"
title = "Client Validation Report"

[[targets.exports]]
name = "client_schema_doc"
type = "schema_doc"
output = "out/client_docs"
format = "markdown"
title = "Client Schema Documentation"

[[targets.exports]]
name = "asset_manifest_json"
type = "asset_manifest"
output = "out/client_assets"
file_name = "client_assets.json"
format = "json"
include_source_location = true

[[targets.exports]]
name = "asset_manifest_csv"
type = "asset_manifest"
output = "out/client_assets"
file_name = "client_assets.csv"
format = "csv"
include_source_location = true

[[targets.exports]]
name = "asset_manifest_csv_simple"
type = "asset_manifest"
output = "out/client_assets"
file_name = "client_assets_simple.csv"
format = "csv"
csv_mode = "simple"

[[targets.exports]]
type = "lua_table"
output = "out/client_lua"
module_name = "reference_game_config"
root_file = "init.lua"
row_layout = "array_with_metatable"
lazy_require = true

[targets.exports.i18n]
mode = "global_function"
function = "globalTranslate"
returns = "optional"

[[targets.exports]]
type = "rust"
output = "out/client_code/rust"
file_name = "reference_game_config"
module_name = "reference_game_config"

[targets.exports.i18n]
mode = "global_function"
function = "crate::global_translate"
returns = "optional"

[[targets.exports]]
name = "rust_external"
type = "rust"
output = "out/client_code/rust_external"
file_name = "reference_game_config"
module_name = "reference_game_config"

[targets.exports.rust]
runtime_interface = "external"
runtime_interface_emit = "reference"

[[targets.exports]]
type = "typescript"
output = "out/client_code/typescript"
file_name = "reference_game_config"
module_name = "referenceGameConfig"

[targets.exports.i18n]
mode = "global_function"
function = "globalTranslate"
returns = "optional"
typescript_import = "import { globalTranslate } from './i18n'"

[[targets.exports]]
type = "cpp"
output = "out/client_code/cpp"
file_name = "reference_game_config"
module_name = "ReferenceGameConfig"
namespace = "reference::game::config"

[targets.exports.i18n]
mode = "global_function"
function = "GlobalTranslate"
returns = "optional"
cpp_include = "\"reference_game_i18n.hpp\""

[[targets.exports]]
name = "cpp_external"
type = "cpp"
output = "out/client_code/cpp_external"
file_name = "reference_game_config"
module_name = "ReferenceGameConfig"
namespace = "reference::game::config"

[targets.exports.cpp]
runtime_interface = "external"
runtime_interface_emit = "reference"

[targets.exports.i18n]
mode = "global_function"
function = "GlobalTranslate"
returns = "optional"
cpp_include = "\"reference_game_i18n.hpp\""

[[targets.exports]]
type = "cpp_unreal"
output = "out/client_code/cpp_unreal"
file_name = "reference_game_config"
namespace = "ReferenceGameConfig"

[targets.exports.cpp_unreal]
support = "containers"
api_macro = "REFERENCE_GAME_CONFIG_API"

[[targets.exports]]
type = "csharp"
output = "out/client_code/csharp"
file_name = "reference_game_config"
namespace = "ReferenceGame.Config"

[targets.exports.csharp]
nullable = true
access_modifier = "public"
emit_runtime_adapters = true

[[targets.exports]]
type = "java"
output = "out/client_code/java"
file_name = "ReferenceGameConfig"
namespace = "referencegame.config"

[targets.exports.java]
package = "referencegame.config"
root_class_name = "ReferenceGameConfig"
access_modifier = "public"
emit_runtime_adapters = true

[[targets]]
name = "client_unity"
tags = ["client"]

[[targets.exports]]
type = "csharp"
output = "out/client_code/unity"
file_name = "reference_game_config"
namespace = "ReferenceGame.Config.Unity"

[targets.exports.csharp]
profile = "unity"
nullable = true
access_modifier = "public"
emit_runtime_adapters = true

[[targets]]
name = "server"
tags = ["server"]

[[targets.exports]]
type = "messagepack"
output = "out/server_data/msgpack"

[[targets.exports]]
type = "bin"
output = "out/server_data/binary"

[[targets.exports]]
type = "rust"
output = "out/server_code/rust"
file_name = "reference_game_config"
module_name = "reference_game_config"

[targets.exports.i18n]
mode = "global_function"
function = "crate::global_translate"
returns = "optional"

[[targets.exports]]
name = "server_schema_doc"
type = "schema_doc"
output = "out/server_docs"
format = "markdown"
title = "Server Schema Documentation"

[[targets]]
name = "server_dotnet"
tags = ["server"]

[[targets.exports]]
type = "csharp"
output = "out/server_code/dotnet"
file_name = "reference_game_config"
namespace = "ReferenceGame.Config.Server"

[targets.exports.csharp]
profile = "dotnet"
nullable = true
access_modifier = "public"
emit_runtime_adapters = true
