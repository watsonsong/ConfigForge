[package]
name = "config-forge-runtime-serde-msgpack-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ConfigForge MessagePack runtime data reader for generated Rust code."
license = "Apache-2.0"
keywords = ["configforge", "runtime", "reader", "msgpack"]
categories = ["encoding", "game-development"]
repository = "https://github.com/ConfigForge/ConfigForge"

[package.metadata.config-forge]
parser-backend = "rmp-serde"
parser-backend-version = "1.3"
adapter-support-level = "stable"

[lib]
name = "config_forge_runtime_serde_msgpack_reader"
path = "src/runtime_reader.rs"

[dependencies]
config-forge-runtime-reader-core = { version = "0.1.0", path = "../reader_core" }
rmp-serde = "1.3"
serde_json = "1.0"
