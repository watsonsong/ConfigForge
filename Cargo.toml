[package]
name = "config_forge"
version = "0.1.0"
edition = "2021"
description = "A Rust CLI toolkit for validating designer-authored game data and exporting runtime-ready assets."

[lib]
name = "config_forge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.1", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
toml = "0.7.4"

[dev-dependencies]
assert_cmd = "2.0.8"
predicates = "2.1.5"
tempfile = "3.10"
