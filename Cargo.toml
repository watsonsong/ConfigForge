[package]
name = "config-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ConfigForge is a schema-driven game configuration export tool that validates designer-authored data and generates runtime-ready artifacts."
license = "Apache-2.0"

[lib]
name = "config_forge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.1", features = ["derive"] }
csv = "1.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "1.0"
toml = "0.7.4"

[dev-dependencies]
assert_cmd = "2.0.8"
predicates = "2.1.5"
tempfile = "3.10"
