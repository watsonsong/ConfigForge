[package]
name = "config-forge"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "ConfigForge is an AI-driven, schema-first game configuration export tool that validates designer-authored data and generates runtime-ready artifacts for multiple languages and platforms."
license = "Apache-2.0"
repository = "https://github.com/watsonsong/ConfigForge"
homepage = "https://github.com/watsonsong/ConfigForge"
readme = "README.md"
keywords = ["game-development", "configuration", "code-generation", "ai-driven", "schema-validation"]
categories = ["game-development", "config", "development-tools::build-utils", "encoding"]
exclude = [
  "/Documentation",
  "/tests",
  "/.github",
  "/runtime",
  "/examples",
  "AGENTS.md",
  ".cargo/config.toml"
]

[lib]
name = "config_forge"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
rayon = "1.12"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
thiserror = "2.0"
toml = "1.1"

[dev-dependencies]
assert_cmd = "2.2"
config-forge-runtime-reader-core = { path = "runtime/rust/reader_core" }
predicates = "3.1"
tempfile = "3.27"
