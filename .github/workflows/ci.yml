name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.99.1"
  CONFIG_FORGE_TEST_PROFILE: quick
jobs:
  quality-check:
    name: Quality checks (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: Install .NET SDK for C# runtime tests
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Install Node.js for TypeScript runtime tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: runtime/typescript/package-lock.json
      - name: Check TypeScript runtime packages and backend integration
        working-directory: runtime/typescript
        run: |
          npm ci --include=dev
          npm run typecheck
          npm test
      - name: Enable TypeScript compiler for generated-code tests
        run: echo "$GITHUB_WORKSPACE/runtime/typescript/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check code formatting
        run: cargo fmt --all --check
      - name: Run clippy lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run unit, integration, and runtime tests
        run: cargo test --locked
      - name: Check standalone Rust runtime crates
        shell: bash
        run: |
          for crate in reader_core binary_reader serde_json_reader serde_msgpack_reader; do
            manifest="runtime/rust/$crate/Cargo.toml"
            cargo fmt --manifest-path "$manifest" --check
            cargo clippy --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --manifest-path "$manifest"
          done
  build-cross-platform:
    name: Build on ${{ matrix.os }}
    needs: quality-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - name: Install .NET SDK for C# runtime tests
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Test platform behavior and core integrations
        run: cargo test --locked --target ${{ matrix.target }} --lib --test architecture --test cli_integration --test runtime_compliance --test runtime_helper_release_metadata
